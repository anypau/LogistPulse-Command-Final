name: Run LogistPulse Smart Inventory

on:
  push:
  workflow_dispatch:

jobs:
  compile-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile
        run: |
          mkdir -p out
          find src -name '*.java' > sources.txt
          javac -d out @sources.txt
      - name: Run demo and check results
        run: java -cp out logistpulse.Main
